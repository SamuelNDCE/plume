<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: file: plume-plugin:; style-src 'self' 'unsafe-inline' plume-plugin:; script-src 'self' plume-plugin:; font-src 'self' data:; connect-src 'self' ws://localhost:5199 http://localhost:5199" />
    <title>Plume</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/plume-logo.svg" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="sidebar-head">
          <div id="sidebar-tabs" role="tablist" aria-label="Sidebar">
            <button type="button" role="tab" data-pane="files" aria-selected="true" class="active">Files</button>
            <button type="button" role="tab" data-pane="search" aria-selected="false">Search</button>
          </div>
        </div>
        <div id="files-pane" class="pane" role="tabpanel"></div>
        <div id="search-pane" class="pane" role="tabpanel" hidden></div>
        <span id="sidebar-actions"></span>
      </aside>
      <div id="sidebar-resizer"></div>
      <main id="main">
        <header id="header">
          <div id="crumb"></div>
          <div id="header-actions"></div>
        </header>
        <div id="doc">
          <div id="editor-scroll">
            <div id="editor"></div>
          </div>
          <div id="cm-host" hidden></div>
          <div id="viewer-host" hidden></div>
          <div id="empty" hidden></div>
        </div>
        <footer id="statusbar"></footer>
      </main>
    </div>
    <div id="find-root"></div>
    <div id="palette-root"></div>
    <div id="settings-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
