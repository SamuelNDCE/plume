<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' ws://localhost:5199 http://localhost:5199" />
    <title>Plume</title>
  </head>
  <body>
    <div id="app">
      <nav id="rail" aria-label="Sections">
        <div id="rail-top">
          <button data-pane="files" class="active" title="Library (Ctrl+Shift+E)" aria-label="Library"></button>
          <button data-pane="outline" title="Outline (Ctrl+Shift+L)" aria-label="Outline"></button>
          <button data-pane="search" title="Search folder (Ctrl+Shift+F)" aria-label="Search"></button>
        </div>
        <div id="rail-bottom">
          <button id="rail-settings" title="Settings (Ctrl+,)" aria-label="Settings"></button>
        </div>
      </nav>
      <aside id="sidebar">
        <div id="sidebar-head">
          <span id="sidebar-title">Library</span>
          <span id="sidebar-actions"></span>
        </div>
        <div id="files-pane" class="pane"></div>
        <div id="outline-pane" class="pane" hidden></div>
        <div id="search-pane" class="pane" hidden></div>
      </aside>
      <div id="sidebar-resizer"></div>
      <main id="main">
        <header id="header">
          <div id="crumb"></div>
          <div id="header-actions"></div>
        </header>
        <div id="doc">
          <div id="editor-scroll">
            <div id="editor"></div>
          </div>
          <div id="cm-host" hidden></div>
          <div id="viewer-host" hidden></div>
          <div id="empty" hidden></div>
        </div>
        <footer id="statusbar"></footer>
      </main>
    </div>
    <div id="find-root"></div>
    <div id="palette-root"></div>
    <div id="settings-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
