name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unsigned build: macOS, Linux, and Windows until the Azure signing secrets below exist.
      - name: Build (unsigned)
        if: matrix.os != 'windows-latest' || env.AZURE_CLIENT_ID == ''
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Windows build signed with Azure Artifact Signing. Runs automatically once AZURE_* secrets and
      # AZURE_SIGNING_* variables are set on the repository. Setup: docs/CODE-SIGNING.md
      - name: Build (Windows, signed)
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        run: >
          npx electron-builder --publish never
          -c.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}"
          -c.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_SIGNING_ACCOUNT }}"
          -c.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_SIGNING_PROFILE }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: plume-${{ matrix.os }}
          path: |
            release/Plume-*
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum Plume-* > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'assets/Plume-*'
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "Plume ${{ github.ref_name }}" --generate-notes
